[tox]
envlist=
    py{310,311,312,313,313t,314,314t}-core
    py{310,311,312,313,313t,314,314t}-wheel
    windows-wheel

[flake8]
exclude=venv*,.tox,docs,build
extend-ignore=E203
max-line-length=88
per-file-ignores=__init__.py:F401

[blocklint]
max_issue_threshold=1

[testenv]
pass_env=
    PIP_CONSTRAINT
    PIP_BUILD_CONSTRAINT
usedevelop=True
install_command=python -m pip install {opts} {packages}
commands=
    core: pytest {posargs:tests/core}
basepython=
    windows-wheel: python
extras=
    test
allowlist_externals=make,pre-commit
deps=
    eth-hash[pycryptodome]

[testenv:py{310,311,312,313,313t,314,314t}-wheel]
package=wheel
usedevelop=False
skip_install=False
changedir={envtmpdir}
deps=
    build[virtualenv]
extras=test
commands=
    python -m build --sdist --outdir {envtmpdir}/sdist {toxinidir}
    python -c "import importlib.machinery; import faster_eth_utils.address as module; assert any(module.__file__.endswith(suffix) for suffix in importlib.machinery.EXTENSION_SUFFIXES), module.__file__; print(module.__file__)"
    pytest {posargs:{toxinidir}/tests/core}

[testenv:windows-wheel]
package=wheel
usedevelop=False
skip_install=False
changedir={envtmpdir}
deps=
    build[virtualenv]
extras=test
commands=
    python -m build --sdist --outdir {envtmpdir}/sdist {toxinidir}
    python -c "import importlib.machinery; import faster_eth_utils.address as module; assert any(module.__file__.endswith(suffix) for suffix in importlib.machinery.EXTENSION_SUFFIXES), module.__file__; print(module.__file__)"
    pytest {posargs:{toxinidir}/tests/core}

[pkgenv]
pass_env=
    PIP_CONSTRAINT
    PIP_BUILD_CONSTRAINT
