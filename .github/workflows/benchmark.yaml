name: Benchmark Suite
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-wheel:
    name: Build wheel for Python3.14
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.mypycify.outputs.artifact-name }}
    steps:
    - uses: actions/checkout@v6
    - name: Build wheel with mypycify
      id: mypycify
      uses: BobTheBuidler/mypycify@v0.3.3
      with:
        python-version: '3.14'
        hash-key: 'pyproject.toml

          setup.py

          faster_eth_utils/**/*.py

          '
        pip-cache-dependency-path: 'pyproject.toml

          setup.py

          tox.ini

          '
  codspeed-benchmark:
    needs: build-wheel
    name: Run CodSpeed Benchmarks
    runs-on: ubuntu-latest
    if: ${{ (github.repository == 'BobTheBuidler/faster-eth-utils' || vars.CODSPEED_ENABLED == 'true') && (github.event.inputs.run-type == 'both' || github.event.inputs.run-type == '' || github.event.inputs.run-type == 'codspeed') }}
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: 'pyproject.toml

          setup.py

          tox.ini

          '
    - name: Download wheel
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.build-wheel.outputs.artifact-name }}
        path: .
    - name: Install built wheel and codspeed dependencies
      run: 'python -m pip install --upgrade pip

        pip install "$(find . -name ''*.whl'')" -r requirements-codspeed.txt

        '
    - name: Remove Python files from test env
      run: rm -r faster_eth_utils
    - name: Run CodSpeed
      uses: CodSpeedHQ/action@v4
      with:
        mode: instrumentation
        run: pytest --codspeed -k "test_faster_" --test-group=${{ matrix.shard }} --test-group-count=6 benchmarks/
  comparison-benchmark:
    name: Run Comparison Benchmarks
    runs-on: ubuntu-latest
    needs: build-wheel
    if: ${{ github.event.inputs.run-type == 'both' || github.event.inputs.run-type == '' || github.event.inputs.run-type == 'comparison' }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: 'pyproject.toml

          setup.py

          tox.ini

          '
    - name: Download built wheel artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.build-wheel.outputs.artifact-name }}
        path: .
    - name: Install built wheel and benchmark dependencies
      run: pip install ./*.whl -r requirements-benchmark.txt
    - name: Remove Python files from test env
      run: 'rm -r faster_eth_utils

        '
    - name: Run Pytest Benchmark & Save Output
      run: pytest --benchmark-only --benchmark-json=benchmark.json benchmarks/
    - name: Upload Pytest Benchmark Results
      uses: actions/upload-artifact@v7
      with:
        name: pytest-benchmark-results
        path: benchmark.json
    - name: Parse Pytest Benchmark Output
      run: python scripts/benchmark/parse_benchmark_output.py benchmark.json pytest_benchmark_results.json
    - name: Compare Pytest Benchmark Results
      run: python scripts/benchmark/compare_benchmark_results.py pytest_benchmark_results.json pytest_benchmark_diff.json
    - name: Generate Markdown Benchmark Results
      run: python scripts/benchmark/generate_benchmark_markdown.py
    - name: Commit and Push Markdown Benchmark Results
      continue-on-error: true
      run: "git config --local user.name \"github-actions[bot]\"\ngit config --local user.email \"github-actions[bot]@users.noreply.github.com\"\ngit fetch origin master\ngit checkout master\ngit add benchmarks/results/*.md\nif git diff --cached --quiet; then\n  echo \"No changes to commit.\"\nelse\n  git commit -m \"Update benchmark results [skip ci]\"\n  git push origin HEAD:master\nfi\n"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: github.repository == 'BobTheBuidler/faster-eth-utils' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    - name: Upload Markdown Benchmark Results
      uses: actions/upload-artifact@v7
      with:
        name: markdown-benchmark-results
        path: benchmarks/results/*.md
    - name: Upload Pytest Benchmark Diff
      uses: actions/upload-artifact@v7
      with:
        name: pytest-benchmark-diff
        path: pytest_benchmark_diff.json
    - name: Post Pytest Benchmark Diff as PR Comment
      uses: actions/github-script@v8
      with:
        script: "const fs = require('fs');\nconst diff = JSON.parse(fs.readFileSync('pytest_benchmark_diff.json', 'utf8'));\nlet body = '### Pytest Benchmark Diff\\n\\n';\n// Get repo and branch info from context\nconst repo = `${context.repo.owner}/${context.repo.repo}`;\nconst branch = context.payload.pull_request ? context.payload.pull_request.head.ref : context.ref.replace('refs/heads/', '');\nfor (const [submodule, groupDiffs] of Object.entries(diff)) {\n  // Convert submodule name to submodule file path (e.g., faster_eth_utils.abi -> faster_eth_utils/types.py)\n  let submoduleFile = \"unknown\";\n  let benchmarkFile = \"unknown\";\n  const m = submodule.match(/^faster_eth_utils\\.(.+)$/);\n  if (m) {\n    submoduleFile = `faster_eth_utils/${m[1]}.py`;\n    benchmarkFile = `benchmarks/test_${m[1]}_benchmarks.py`;\n  }\n  const submoduleUrl = `https://github.com/${repo}/blob/${branch}/${submoduleFile}`;\n  const benchmarkUrl = `https://github.com/${repo}/blob/${branch}/${benchmarkFile}`;\n\
          \  body += `#### [${submodule}](${submoduleUrl}) - [view benchmarks](${benchmarkUrl})\\n`;\n  body += '| Function | Reference Mean | Faster Mean | % Change | Speedup (%) | x Faster | Faster |\\n';\n  body += '|----------|---------------|-------------|----------|-------------|----------|--------|\\n';\n  for (const [group, data] of Object.entries(groupDiffs).sort(([a], [b]) => a.localeCompare(b))) {\n    if (data.percent_change !== null && data.percent_change !== undefined) {\n      let emoji = '\u2796';\n      if (data.percent_change > 0) emoji = '\u2705';\n      else if (data.percent_change < 0) emoji = '\u274C';\n      const percentChange = data.percent_change !== undefined && data.percent_change !== null\n        ? `${data.percent_change.toFixed(2)}%` : '';\n      const speedupPercent = data.speedup_percent !== undefined && data.speedup_percent !== null\n        ? `${data.speedup_percent.toFixed(2)}%` : '';\n      const speedupX = data.speedup_x !== undefined && data.speedup_x\
          \ !== null && isFinite(data.speedup_x)\n        ? `${data.speedup_x.toFixed(2)}x` : '';\n      body += `| \\`${group}\\` | ${data.reference_mean} | ${data.faster_mean} | ${percentChange} | ${speedupPercent} | ${speedupX} | ${emoji} |\\n`;\n    } else if (data.note) {\n      body += `| \\`${group}\\` |  |  |  |  |  | \u2796 |\\n`;\n    }\n  }\n  body += '\\n';\n}\ngithub.rest.issues.createComment({\n  ...context.repo,\n  issue_number: context.issue.number,\n  body\n});\n"
      if: github.event_name == 'pull_request'
'on':
  pull_request:
    branches:
    - main
    - master
    paths:
    - faster_eth_utils/**/*.py
    - benchmarks/**/*.py
    - .github/workflows/benchmark.yaml
    - pyproject.toml
    - setup.py
    - requirements-benchmark.txt
    - requirements-codspeed.txt
    - requirements-pytest.txt
  push:
    branches:
    - main
    - master
    paths:
    - faster_eth_utils/**/*.py
    - benchmarks/**/*.py
    - .github/workflows/benchmark.yaml
    - pyproject.toml
    - setup.py
    - requirements-benchmark.txt
    - requirements-codspeed.txt
    - requirements-pytest.txt
  workflow_dispatch:
    inputs:
      run-type:
        description: Select which benchmarks to run
        required: false
        default: both
        type: choice
        options:
        - both
        - codspeed
        - comparison
