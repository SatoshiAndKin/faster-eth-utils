---
name: Tox
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: "${{ steps.paths.outputs.run_validation }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_INCLUDE_PATHS: '["**.py",".github/workflows/tox.yaml","pyproject.toml","setup.py"]'
        CI_IGNORE_PATHS: "[]"
      run: python3 .github/scripts/ci_changes.py
  tox:
    name: Test (${{ matrix.jobtype }}, ${{ matrix.pyversion}}, ${{ matrix.os }}, ${{ matrix.architecture }})
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        jobtype:
        - core
        - wheel
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        pyversion:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - 3.13t
        - '3.14'
        - 3.14t
        architecture:
        - x64
        - x86
        exclude:
        - os: macos-latest
          architecture: x86
      max-parallel: "${{ github.event_name == 'schedule' && 4 || 1000 }}"
    env:
      TOXENV: py${{ matrix.pyversion }}-${{ matrix.jobtype }}
      TOX_RECREATE_FLAG: "${{ github.event_name == 'schedule' && '-r' || '' }}"
      IS_UBUNTU_32BIT: "${{ matrix.os == 'ubuntu-latest' && matrix.architecture == 'x86' }}"
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: "${{ github.head_ref }}"
    - name: Run job in 32-bit Ubuntu Docker container
      if: "${{ env.IS_UBUNTU_32BIT == 'true' }}"
      uses: addnab/docker-run-action@v3
      with:
        image: i386/python:${{ matrix.pyversion }}
        shell: bash
        options: "-v ${{ github.workspace }}:/workspace -w /workspace"
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox
          python -m tox -e ${{ env.TOXENV }} ${{ env.TOX_RECREATE_FLAG }}
      continue-on-error: "${{ matrix.pyversion == '3.13t' || matrix.pyversion == '3.14t' }}"
    - name: Set up Python (macos)
      if: "${{ matrix.os == 'macos-latest' }}"
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.pyversion }}"
        cache: pip
        cache-dependency-path: |
          setup.py
          pyproject.toml
          tox.ini
    - name: Set up Python
      if: "${{ matrix.os != 'macos-latest' && env.IS_UBUNTU_32BIT != 'true' }}"
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.pyversion }}"
        architecture: "${{ matrix.architecture }}"
        cache: pip
        cache-dependency-path: |
          setup.py
          pyproject.toml
          tox.ini
    - name: Cache .mypy_cache
      if: "${{ env.IS_UBUNTU_32BIT != 'true' }}"
      uses: actions/cache@v5
      with:
        path: ".mypy_cache"
        key: mypy-cache-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}
    - name: Install tox
      if: "${{ env.IS_UBUNTU_32BIT != 'true' }}"
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Cache tox environment and hypothesis examples
      if: "${{ env.IS_UBUNTU_32BIT != 'true' }}"
      uses: actions/cache@v5
      with:
        path: |
          .tox
          .hypothesis
        key: "${{ runner.os }}-tox-${{ hashFiles('pyproject.toml', 'setup.py', 'tox.ini') }}-${{ matrix.pyversion }}-${{ matrix.architecture }}-${{ matrix.jobtype }}"
        save-always: "${{ env.TOX_RECREATE_FLAG == '-r' }}"
    - name: Run tox
      if: "${{ env.IS_UBUNTU_32BIT != 'true' }}"
      run: python -m tox run ${{ env.TOX_RECREATE_FLAG }}
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  ci_gate:
    name: CI (tox.yaml)
    if: "${{ !cancelled() }}"
    needs:
    - ci_changes
    - tox
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: "${{ toJSON(needs) }}"
        CI_EXPECTED_JOBS: '["tox"]'
      run: |-
        python3 -m unittest discover -s .github/scripts -p test_ci_contract.py
        python3 .github/scripts/ci_gate.py
'on':
  pull_request:
    branches:
    - master
    - faster-4.1.1
  schedule:
  - cron: 0 12 * * *
  workflow_dispatch:
