name: Compile
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '[]'
        CI_IGNORE_PATHS: '[".circleci/**",".github/workflows/**","!.github/workflows/compile.yaml","benchmarks/**","tests/**","tox.ini","requirements-benchmark.txt","requirements-codspeed.txt","requirements-pytest.txt","requirements-test.txt","**.md",".gitignore","*.md"]'
      run: python3 .github/scripts/ci_changes.py
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: 'setup.py

          pyproject.toml

          '
    - name: Build the actual compiled wheel
      run: 'python -m pip install build

        python -m build --wheel'
    - name: Normalize generated review source
      run: 'python3 -m unittest discover -s .github/scripts -p "test_*.py"

        python3 .github/scripts/normalize_generated_c.py'
    - name: Verify generated source is current
      run: git diff --exit-code -- build
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
    env:
      PYTHONHASHSEED: '0'
  ci_gate:
    name: CI (compile.yaml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - build-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["build-ubuntu"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
'on':
  pull_request:
    branches:
    - master
    - faster-4.1.1
  push:
    branches:
    - master
permissions:
  contents: read
