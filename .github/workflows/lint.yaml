name: Lint
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: ${{ steps.paths.outputs.run_validation }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: ${{ github.token }}
        CI_INCLUDE_PATHS: '[]'
        CI_IGNORE_PATHS: '[".github/workflows/**","!.github/workflows/lint.yaml",".gitignore","*.md"]'
      run: python3 .github/scripts/ci_changes.py
  pyupgrade:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install PyUpgrade
      run: pip install pyupgrade
    - name: Run PyUpgrade
      run: find . -name '*.py' -exec pyupgrade --py310-plus --exit-zero-even-if-changed {} +
    - name: Verify formatting leaves tracked files unchanged
      run: git diff --exit-code
    needs:
    - ci_changes
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  autoflake:
    runs-on: ubuntu-latest
    needs:
    - pyupgrade
    - ci_changes
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install Autoflake
      run: pip install autoflake
    - name: Run Autoflake
      run: autoflake --remove-all-unused-imports --in-place --expand-star-imports --ignore-init-module-imports -r .
    - name: Verify formatting leaves tracked files unchanged
      run: git diff --exit-code
    if: ${{ needs.ci_changes.outputs.run_validation == 'true' }}
  ci_gate:
    name: CI (lint.yaml)
    if: ${{ !cancelled() }}
    needs:
    - ci_changes
    - pyupgrade
    - autoflake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: ${{ toJSON(needs) }}
        CI_EXPECTED_JOBS: '["pyupgrade","autoflake"]'
      run: 'python3 -m unittest discover -s .github/scripts -p test_ci_contract.py

        python3 .github/scripts/ci_gate.py'
'on':
  pull_request:
    branches:
    - master
  push:
    branches:
    - master
permissions:
  contents: read
